name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select runner'
        required: true
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'self-hosted' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/home/pelonis/files-converter' }}

            # Pull latest code
            git pull origin main

            # Load env vars for build args
            set -a && source .env && set +a

            # Build Docker image with env vars baked in
            docker build \
              --build-arg NEXT_PUBLIC_BACKEND_URL="$NEXT_PUBLIC_BACKEND_URL" \
              --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              -t files-converter .

            # Stop and remove old container (if running)
            docker stop files-converter 2>/dev/null || true
            docker rm files-converter 2>/dev/null || true

            # Start new container
            docker run -d \
              --name files-converter \
              --restart unless-stopped \
              -p 4000:4000 \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=5 \
              files-converter

            # Clean up old Docker images
            docker image prune -f
